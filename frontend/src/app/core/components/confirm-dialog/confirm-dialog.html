@if (open()) {
  <div class="confirm-backdrop" (click)="onBackdropClick($event)">
    <div
      class="confirm-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-message"
    >
      <p id="confirm-message" class="confirm-message">{{ message() }}</p>

      <div class="confirm-actions">
        <button type="button" class="btn btn-cancel" (click)="onCancel()">
          {{ cancelLabel() }}
        </button>
        <button type="button" class="btn btn-confirm" (click)="onConfirm()" autofocus>
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
