<div class="day-cell">
    <span class="day-number">{{ dayDate.date | date:'dd/MM' }}</span>

    <ul class="day-events">
        @for (calendarEvent of dayDate.events; track calendarEvent.id) {
            <li class="event">
                <span class="event-title">{{ calendarEvent.title }}</span>
            </li>
        }
    </ul>
</div>
