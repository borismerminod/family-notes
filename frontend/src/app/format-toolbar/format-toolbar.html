<!--
  Barre d'outils de formatage — construite groupe par groupe (TDD, skill dev_par_groupes).
  Réalisé : G1 marques, G2 couleur, G3 taille, G4 listes, G7 image (popup).
  À venir : G8 vidéo (popup).
-->
<div class="format-toolbar" role="toolbar" aria-label="Mise en forme">
  <!-- G1 — Marques sémantiques -->
  <div class="toolbar-group">
    <button
      type="button"
      class="btn-bold"
      (click)="applyMark('bold')"
      title="Gras"
      aria-label="Gras"
    >
      <strong>G</strong>
    </button>
    <button
      type="button"
      class="btn-italic"
      (click)="applyMark('italic')"
      title="Italique"
      aria-label="Italique"
    >
      <em>I</em>
    </button>
    <button
      type="button"
      class="btn-underline"
      (click)="applyMark('underline')"
      title="Souligné"
      aria-label="Souligné"
    >
      <u>S</u>
    </button>
  </div>

  <!-- G3 — Taille -->
  <div class="toolbar-group">
    @for (s of sizes; track s.size) {
      <button
        type="button"
        [class]="'btn-size-' + s.size"
        (click)="applySize(s.size)"
        [title]="s.title"
        [attr.aria-label]="s.title"
      >
        {{ s.label }}
      </button>
    }
  </div>

  <!-- G4 — Listes -->
  <div class="toolbar-group">
    <button
      type="button"
      class="btn-list-bullet"
      (click)="applyList('bullet')"
      title="Liste à puces"
      aria-label="Liste à puces"
    >
      • Liste
    </button>
    <button
      type="button"
      class="btn-list-numbered"
      (click)="applyList('numbered')"
      title="Liste numérotée"
      aria-label="Liste numérotée"
    >
      1. Liste
    </button>
  </div>

  <!-- G2 — Couleur -->
  <div class="toolbar-group colors">
    @for (color of palette; track color) {
      <button
        type="button"
        class="color-swatch"
        [attr.data-color]="color"
        [title]="color"
        [style.background-color]="color"
        (click)="applyColor(color)"
        aria-label="Couleur du texte"
      ></button>
    }
  </div>

  <!-- G7/G8 — Médias (boutons déclencheurs des popups) -->
  <div class="toolbar-group">
    <button
      type="button"
      class="btn-image"
      (click)="openImagePopup()"
      title="Insérer une image"
      aria-label="Insérer une image"
    >
      🖼
    </button>
    <button
      type="button"
      class="btn-video"
      (click)="openVideoPopup()"
      title="Insérer une vidéo"
      aria-label="Insérer une vidéo"
    >
      🎬
    </button>
  </div>
</div>

<!-- G7 — Popup d'insertion d'image (rendu conditionnel, D12) -->
@if (imagePopupOpen()) {
  <div class="media-popup image-popup" role="dialog" aria-label="Insérer une image">
    <div class="popup-row">
      <input
        type="text"
        class="image-url-input"
        placeholder="Lien de l'image (https://…)"
        [value]="imageUrl()"
        (input)="imageUrl.set($any($event.target).value)"
      />
      <button type="button" class="btn-image-link" (click)="insertImageFromUrl()">
        Insérer le lien
      </button>
    </div>
    <label class="popup-file">
      Depuis le PC
      <input
        type="file"
        class="btn-image-file"
        accept="image/*"
        (change)="onImageFile($event)"
      />
    </label>
    <button
      type="button"
      class="btn-close-popup"
      (click)="closeImagePopup()"
      aria-label="Fermer"
    >
      ✕
    </button>
  </div>
}

<!-- G8 — Popup d'insertion de vidéo (lien seul, D11 — pas de champ fichier) -->
@if (videoPopupOpen()) {
  <div class="media-popup video-popup" role="dialog" aria-label="Insérer une vidéo">
    <div class="popup-row">
      <input
        type="text"
        class="video-url-input"
        placeholder="Lien de la vidéo (YouTube, Vimeo…)"
        [value]="videoUrl()"
        (input)="videoUrl.set($any($event.target).value)"
      />
      <button type="button" class="btn-video-link" (click)="insertVideoFromUrl()">
        Insérer la vidéo
      </button>
    </div>
    <button
      type="button"
      class="btn-close-popup"
      (click)="closeVideoPopup()"
      aria-label="Fermer"
    >
      ✕
    </button>
  </div>
}
