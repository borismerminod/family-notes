<div class="calendar">
    <div class="month-title">
        <button class="nav-btn" (click)="goToPreviousMonth()" aria-label="Mois précédent">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <span>{{ selectedMonthDate | date:'MMMM y'}}</span>
        <button class="nav-btn" (click)="goToNextMonth()" aria-label="Mois suivant">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <div class="calendar-grid">
        <div class="weekday">L</div>
        <div class="weekday">M</div>
        <div class="weekday">M</div>
        <div class="weekday">J</div>
        <div class="weekday">V</div>
        <div class="weekday">S</div>
        <div class="weekday">D</div>

        @for (day of days(); track day) {
            @if (day !== null) {
                <app-calendar-day
                    [dayDate]="day"
                    [class.other-month]="!isCurrentMonth(day)"
                >
                </app-calendar-day>
            } @else {
                <div class="empty-cell"></div>
            }
        }
    </div>
</div>
