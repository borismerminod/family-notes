<div class="calendar">
    <div class="month-title">
        <div class="month-nav">
            <button type="button" class="nav-btn" (click)="goToPreviousMonth()" aria-label="Mois précédent">
                ←
            </button>
            <span class="month-label">{{ selectedMonthDate | date:'MMMM y'}}</span>
            <button type="button" class="nav-btn" (click)="goToNextMonth()" aria-label="Mois suivant">
                →
            </button>
        </div>
        <div class="period-controls">
            <input
                #monthPicker
                type="month"
                class="month-picker"
                aria-label="Choisir le mois et l'année"
                [value]="selectedMonthDate"
                (change)="chooseMonth(monthPicker.value)"
            />
            <button type="button" class="today-btn" (click)="goToToday()">Aujourd'hui</button>
        </div>
    </div>

    @if (eventsLoading()) {
        <p class="events-loading" role="status">Chargement des événements…</p>
    }
    @if (eventsError()) {
        <p class="events-error" role="alert">Impossible de charger les événements de cette période.</p>
    }

    <div class="calendar-grid">
        <div class="weekday">L</div>
        <div class="weekday">M</div>
        <div class="weekday">M</div>
        <div class="weekday">J</div>
        <div class="weekday">V</div>
        <div class="weekday">S</div>
        <div class="weekday">D</div>

        @for (day of days(); track day?.date) {
            @if (day !== null) {
                <app-calendar-day
                    [dayDate]="day"
                    [isOtherMonth]="!isCurrentMonth(day)"
                    [isToday]="isToday(day)"
                    [isSelected]="isSelected(day)"
                    (click)="selectDay(day)"
                >
                </app-calendar-day>
            } @else {
                <div class="empty-cell"></div>
            }
        }
    </div>
</div>
