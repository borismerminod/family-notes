version: '3.8'

services:
  sqlite-ui:
    image: coleifer/sqlite-web
    container_name: family-notes-db
    ports:
      - "8080:8080"
    volumes:
      # On lie le dossier local ./data au dossier /data du conteneur
      - ../data:/data
    environment:
      # Nom du fichier de base de données
      - SQLITE_DATABASE=family_notes.db
    restart: always
