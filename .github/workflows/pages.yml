# Builds the Angular application and publishes it on GitHub Pages.
# Pages serves the site from a sub-folder named after the repository
# (https://<owner>.github.io/<repository>/), hence the --base-href.
# See .agent/COMMANDES.md, section 7.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push does not cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Angular CLI 21 requires Node ^20.19, ^22.12 or >= 24.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Pages only knows real files: serving the application as the 404 page lets
      # the Angular router handle deep links such as /notes/edit/3 on reload.
      - name: Add SPA fallback
        run: cp dist/project_tmp/browser/index.html dist/project_tmp/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/project_tmp/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
