version: '3.8'

services:
  # --- LA BASE DE DONNÉES ---
  db:
    image: coleifer/sqlite-web
    container_name: family-notes-db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - SQLITE_DATABASE=family_notes.db
    working_dir: /data
    restart: always

  # --- LE BACKEND (API Node.js) ---
  backend:
    build: ./backend
    container_name: family-notes-api
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./data:/data
    environment:
      - NODE_ENV=development
      - DB_PATH=/data/family_notes.db
    depends_on:
      - db

  # --- LE FRONTEND (Angular) ---
  frontend:
    build: 
      context: ./frontend
      target: development  # On cible l'étape de dév (Node.js) et non Nginx
    container_name: family-notes-web
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start -- --host 0.0.0.0
    depends_on:
      - backend
